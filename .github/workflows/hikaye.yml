name: Instagram hikaye

on:
  schedule:
    # GitHub zamanlayıcısı tetikleri sık sık atlıyor; 5 dakikada bir denenir, script her saat dilimini
    # yalnızca bir kez paylaşır (state.json). 7-19 UTC = Sofya 09/10-21/22 (yaz/kış saati)
    - cron: "*/5 7-19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Saat kontrolünü atla, hemen paylaş"
        type: boolean
        default: false
      dosya:
        description: "Test: sadece bu dosya ya da önek (örn. gta6_); boş = hepsi"
        type: string
        default: ""

permissions:
  contents: write
  actions: read

concurrency: hikaye

jobs:
  post:
    # Anahtar: depo değişkeni PAYLASIM = acik ise paylaşır (Paylasim_Anahtari.command ya da GitHub ayarlarından)
    if: vars.PAYLASIM == 'acik' || vars.PAYLASIM == 'açık' || inputs.force
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paylaş
        id: paylas
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          MEDIA_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media
          FORCE: ${{ inputs.force && '1' || '0' }}
          DOSYA: ${{ inputs.dosya || vars.ONEK }}   # ONEK=gta6_ -> sadece GTA tasarımları
        shell: bash
        run: python3 post_story.py 2>&1 | tee cikti.txt   # shell: bash = -eo pipefail, hata gizlenmez
      - name: Kaydı güncelle
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "hikaye-bot"
            git config user.email "hikaye-bot@users.noreply.github.com"
            git add state.json
            git commit -m "hikaye paylaşıldı [skip ci]"
            git push
          fi
      - name: Telegram bildirimi (sadece durunca / düzelince)
        if: always() && steps.paylas.outcome != 'skipped'
        continue-on-error: true
        env:
          SONUC: ${{ steps.paylas.outcome }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          GH_TOKEN: ${{ github.token }}
        run: python3 bildir.py
